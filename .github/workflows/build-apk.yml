name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test, compilacion y firma de la APK
    runs-on: ubuntu-24.04
    steps:
      - name: Copiar el codigo
        uses: actions/checkout@v4

      - name: Preparar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'
          accept-android-sdk-licenses: true

      - name: Decodificar keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/release.p12
        shell: bash

      - name: Tests del motor de tiempos y compilacion de la APK
        run: |
          chmod +x gradlew
          ./gradlew :core:test :app:assembleRelease --stacktrace
        env:
          FITFLOW_KEYSTORE_PATH: app/release.p12
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Verificar la firma de la APK
        run: |
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --print-certs \
            app/build/outputs/apk/release/app-release.apk

      - name: Informacion del APK
        run: |
          $ANDROID_HOME/build-tools/35.0.0/aapt2 dump badging \
            app/build/outputs/apk/release/app-release.apk | head -n 25

      - name: Guardar el APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: fitflow-timer-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Publicar la release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
          body: |
            FitFlow Timer ${{ github.ref_name }}

            Temporizador de intervalos Tabata / EMOM / AMRAP para Android.

            Instalacion: descarga el archivo `app-release.apk`, abrelo y permite
            la instalacion desde fuentes desconocidas. Android 8.0 o superior.